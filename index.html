<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shivam’s Lab</title>
  <meta name="description" content="Everything Shivam has made with Claude: apps, websites and interactive pages, in one place.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2F2F7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lab">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta property="og:title" content="Shivam’s Lab">
  <meta property="og:description" content="Everything Shivam has made with Claude, in one place.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to projects</a>

  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <span class="toolbar-title" id="toolbarTitle" aria-hidden="true">Shivam’s Lab</span>
      <div class="search search--top glass" role="search">
        <svg class="search-glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75"/><path d="M12.8 12.8 17 17"/></svg>
        <label class="visually-hidden" for="searchTop">Search projects</label>
        <input id="searchTop" class="search-input" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
        <button class="search-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="m7.2 7.2 5.6 5.6m0-5.6-5.6 5.6"/></svg></button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="page">
      <div class="masthead">
        <span class="lab-mark" id="labMark"></span>
        <div>
          <h1 class="large-title" id="largeTitle">Shivam’s Lab</h1>
          <p class="masthead-sub" id="summary"></p>
        </div>
      </div>

      <div class="segmented" role="group" aria-label="Show" id="segmented">
        <span class="segmented-thumb" aria-hidden="true"></span>
      </div>

      <p class="visually-hidden" id="resultStatus" aria-live="polite"></p>

      <section class="shelf-section" id="shelfSection" aria-labelledby="shelfTitle">
        <h2 class="section-title" id="shelfTitle">Latest</h2>
        <ul class="shelf" id="shelf" role="list"></ul>
      </section>

      <div class="groups" id="groups"></div>

      <div class="empty" id="empty" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="21" cy="21" r="13"/><path d="M31 31l9 9"/></svg>
        <h2>No Results</h2>
        <p>Check the spelling or try a new search.</p>
      </div>

      <footer class="footer" id="footer"></footer>
    </div>
  </main>

  <div class="search search--bottom glass" role="search">
    <svg class="search-glyph" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.75"/><path d="M12.8 12.8 17 17"/></svg>
    <label class="visually-hidden" for="searchBottom">Search projects</label>
    <input id="searchBottom" class="search-input" type="search" placeholder="Search" autocomplete="off" enterkeyhint="search">
    <button class="search-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8"/><path d="m7.2 7.2 5.6 5.6m0-5.6-5.6 5.6"/></svg></button>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
    <div class="sheet-bar" id="grabber">
      <span class="sheet-grabber" aria-hidden="true"></span>
      <button class="sheet-close glass" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <p class="visually-hidden" id="sheetStatus" aria-live="polite"></p>
  </div>

  <script src="icons.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
