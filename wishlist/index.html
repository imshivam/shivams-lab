<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shivam’s Wish List</title>
  <meta name="description" content="Things Shivam would love, if you’re ever looking for a gift.">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-title" content="Wish List">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="canonical" href="https://imshivam.github.io/shivams-lab/wishlist/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://imshivam.github.io/shivams-lab/wishlist/">
  <meta property="og:title" content="Shivam’s Wish List">
  <meta property="og:description" content="Things Shivam would love, if you’re ever looking for a gift.">
  <meta property="og:image" content="https://imshivam.github.io/shivams-lab/wishlist/og.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Four things from Shivam’s wish list.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Shivam’s Wish List">
  <meta name="twitter:description" content="Things Shivam would love, if you’re ever looking for a gift.">
  <meta name="twitter:image" content="https://imshivam.github.io/shivams-lab/wishlist/og.jpg">
  <link rel="preload" href="fonts/funnel-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="base.css?v=202610191619">
  <link rel="stylesheet" href="wishlist.css?v=202610191619">
</head>
<body>
  <a class="skip" href="#main">Skip to the wish list</a>

  <header class="toolbar" id="toolbar">
    <div class="toolbar-inner">
      <span class="toolbar-title" aria-hidden="true"><span class="toolbar-gift" id="toolbarGift"></span>Wish List</span>
      <div class="toolbar-actions">
        <div class="menu-wrap">
          <button class="round glass" id="viewButton" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="viewMenu" aria-label="Layout"></button>
          <div class="menu glass" id="viewMenu" role="group" aria-label="Layout" hidden></div>
        </div>
        <button class="round glass" id="share" type="button" aria-label="Share this wish list">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 12.5V2.8M6.6 6 10 2.6 13.4 6M6.5 9H5.2c-.9 0-1.6.7-1.6 1.6v5.6c0 .9.7 1.6 1.6 1.6h9.6c.9 0 1.6-.7 1.6-1.6v-5.6c0-.9-.7-1.6-1.6-1.6h-1.3"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="page">
      <div class="masthead">
        <button class="gift" id="gift" type="button" aria-label="Can’t decide? Pick a wish for me" title="Pick a wish for me"></button>
        <div>
          <h1 class="large-title" id="largeTitle">Shivam’s Wish List</h1>
          <p class="masthead-sub" id="summary"></p>
        </div>
      </div>

      <div id="wishes"></div>

      <section class="shops" id="shops" aria-labelledby="shops-h">
        <div class="month-head"><h2 id="shops-h">Shops I Like</h2></div>
        <p class="shops-intro">No particular item. A gift card or anything from these is a safe bet.</p>
        <ul class="shop-list" role="list" id="shopList"></ul>
      </section>

      <footer class="footer" id="footer"></footer>
    </div>
  </main>

  <nav class="filterbar" id="filterbar" aria-label="Categories">
    <div class="segmented" role="group" aria-label="Show" id="segmented">
      <span class="segmented-thumb" aria-hidden="true"></span>
    </div>
  </nav>

  <p class="visually-hidden" id="status" aria-live="polite"></p>
  <div class="toast glass" id="toast" role="status" hidden></div>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
    <div class="sheet-bar" id="grabber">
      <span class="sheet-grabber" aria-hidden="true"></span>
      <button class="sheet-close glass" id="sheetClose" type="button" aria-label="Close">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 5.5 9 9m0-9-9 9"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <script src="status.js?v=202610191619"></script>
  <script src="images.js?v=202610191619"></script>
  <script src="wishes.js?v=202610191619"></script>
  <script src="wishlist.js?v=202610191619"></script>
</body>
</html>
