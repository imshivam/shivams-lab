# Keeps the wish list accurate: fetches a photo for each wish and checks that every link still works.
# It never changes prices or marks a wish as gone by itself: the run's summary lists anything that
# needs a look (a link that may be dead, a price that differs, a photo it couldn't get).
# Runs on the 1st of each month, when wishlist/wishes.js changes on main, or by hand from the Actions tab.
name: Wish list photos

on:
  schedule:
    - cron: "17 7 1 * *"  # 07:17 UTC on the 1st of each month
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch every photo again"
        type: boolean
        default: false
      only:
        description: "Fetch these photos again (wish ids, comma-separated)"
        type: string
        default: ""
  push:
    branches: [main]
    paths: [wishlist/wishes.js, wishlist/tools/fetch_images.py]

permissions:
  contents: write

concurrency:
  group: wishlist-photos
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main  # the latest main, not the commit that queued this run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow and a browser for shops that refuse plain requests
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb
      - name: Check links and prices, fetch photos
        env:
          WISHLIST_HEADED: "1"
          ONLY: ${{ inputs.only }}
        run: xvfb-run -a python3 wishlist/tools/fetch_images.py --check ${{ inputs.force && '--force' || '' }} ${ONLY:+--only "$ONLY"}
      - name: Commit changes
        run: |
          git add wishlist/img wishlist/images.js wishlist/status.js wishlist/og.jpg
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wish list: update photos, links and prices"
          git pull --rebase -X theirs origin main  # on a clash, this run's files win
          git push
