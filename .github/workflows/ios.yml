# Builds the iPhone app (ios/) on a Mac whenever it changes, to catch anything that doesn't compile.
# It builds for the iOS Simulator without signing, so it needs no Apple account or secrets.
# Installing on a phone is done from Xcode: see ios/README.md.
name: iPhone app

on:
  push:
    paths: [ios/**, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Build for the iOS Simulator
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -project ios/MyWeek.xcodeproj -scheme MyWeek -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build -quiet
