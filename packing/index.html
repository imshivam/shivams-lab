<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plan your trip day by day, note what you'll wear and need, and get one packing list.">
<style>
/* Layout: one calm column. Plan = a card per day with what you'll wear and need; Pack = the days added up into one list. */
:root {
  --bg: #F2F3F5;
  --card: #FFFFFF;
  --fg: #1D1D1F;
  --muted: #6C6F75;
  --sep: rgba(60, 64, 72, 0.16);
  --fill: rgba(118, 122, 132, 0.12);
  --ring: rgba(60, 64, 72, 0.34);
  --bar: rgba(242, 243, 245, 0.86);
  --seg-on: #FFFFFF;
  --accent: #0A7A72;
  --accent-soft: rgba(10, 122, 114, 0.12);
  --on-accent: #FFFFFF;
  --danger: #D70015;
  --toast: #1D1D1F;
  --on-toast: #F5F5F7;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fg: #F5F5F7; --muted: #98989F;
    --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --ring: rgba(235, 235, 245, 0.36);
    --bar: rgba(0, 0, 0, 0.82); --seg-on: #636366; --accent: #3CCBBE; --accent-soft: rgba(60, 203, 190, 0.16); --on-accent: #00201D;
    --danger: #FF453A; --toast: #F5F5F7; --on-toast: #1D1D1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fg: #F5F5F7; --muted: #98989F;
  --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --ring: rgba(235, 235, 245, 0.36);
  --bar: rgba(0, 0, 0, 0.82); --seg-on: #636366; --accent: #3CCBBE; --accent-soft: rgba(60, 203, 190, 0.16); --on-accent: #00201D;
  --danger: #FF453A; --toast: #F5F5F7; --on-toast: #1D1D1F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
.view { display: grid; gap: 20px; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  margin-bottom: 8px;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  display: flex; justify-content: center;
}
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; width: min(100%, 320px); }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; font-size: 14px; font-weight: 500; min-height: 32px;
  font-variant-numeric: tabular-nums; transition: background-color 0.2s;
}
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); font-weight: 600; }

/* Trip header */
.head { display: grid; gap: 4px; padding-top: 8px; }
.where {
  width: 100%; border: 0; background: transparent; padding: 0;
  font: 700 34px/1.15 var(--font-round); letter-spacing: -0.01em;
}
.where::placeholder { color: var(--muted); opacity: 0.55; }
.sub { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }

.card { background: var(--card); border-radius: var(--r); }
.field { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 8px 16px; min-height: 48px; }
input[type="date"] { border: 0; background: var(--fill); border-radius: 8px; padding: 6px 10px; font-size: 16px; min-height: 34px; }
.clear-date { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 6px 2px; }

/* Day and whole-trip cards */
.block { padding: 14px 16px 12px; display: grid; gap: 10px; }
.block-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.block-head h2 {
  margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.block-head h2 b { color: var(--fg); font-weight: 600; }
.block-intro { margin: -4px 0 0; font-size: 14px; color: var(--muted); }
.plan {
  width: 100%; border: 0; background: transparent; padding: 0; font-size: 19px; font-weight: 600;
}
.plan::placeholder { color: var(--muted); font-weight: 500; opacity: 0.8; }
.plan:focus-visible { outline-offset: 4px; }
.mini { border: 0; background: transparent; color: var(--muted); font-size: 14px; padding: 4px 2px; }
.mini:hover { color: var(--danger); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips:empty { display: none; }
.chip {
  display: inline-flex; align-items: center; gap: 2px; max-width: 100%;
  background: var(--accent-soft); border-radius: 999px; padding: 5px 4px 5px 12px; font-size: 15px;
  animation: chip-in 0.35s var(--spring);
}
.chip span { overflow-wrap: anywhere; }
.chip .x {
  border: 0; background: transparent; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center;
  color: var(--muted); font-size: 17px; line-height: 1; flex: 0 0 auto;
}
.chip .x:hover { background: var(--fill); color: var(--fg); }
@keyframes chip-in { from { transform: scale(0.7); opacity: 0; } to { transform: none; opacity: 1; } }

.add { display: flex; align-items: center; gap: 8px; border-top: 0.5px solid var(--sep); padding-top: 8px; }
.add .plus { color: var(--accent); font-size: 22px; line-height: 1; width: 18px; text-align: center; }
.add input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 0; font-size: 16px; }
.add input::placeholder { color: var(--muted); }
.add input:focus-visible { outline: none; }
.add .go {
  border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; padding: 5px 12px;
}
.suggest { display: grid; gap: 6px; }
.suggest p { margin: 0; font-size: 13px; color: var(--muted); }
.suggest .chips button {
  border: 0; background: var(--fill); border-radius: 999px; padding: 6px 12px; font-size: 15px; min-height: 32px;
}
.suggest .chips button::before { content: "+ "; color: var(--accent); font-weight: 600; }

.add-day {
  border: 1.5px dashed var(--ring); background: transparent; border-radius: var(--r); padding: 14px 16px; min-height: 52px;
  color: var(--accent); font-weight: 600; text-align: center;
}

/* Pack view */
.count-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.count { font: 600 20px var(--font-round); font-variant-numeric: tabular-nums; }
.count.done { color: var(--accent); }
.section { display: grid; gap: 7px; }
.section h2 { margin: 0; padding: 0 16px; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
.list { overflow: hidden; }
.row { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding-right: 12px; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 54px; right: 0; height: 0.5px; background: var(--sep); }
.tick {
  display: grid; grid-template-columns: 26px minmax(0, 1fr); align-items: center; gap: 12px;
  border: 0; background: transparent; text-align: left; padding: 10px 0 10px 16px; min-height: 52px; width: 100%;
}
.tick .text { display: grid; gap: 1px; min-width: 0; }
.tick .name { overflow-wrap: anywhere; transition: color 0.2s; }
.tick .when { font-size: 13px; color: var(--muted); }
.packed .name { color: var(--muted); }
.check {
  width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--ring);
  display: grid; place-items: center; transition: background-color 0.2s, border-color 0.2s;
}
.check svg { width: 14px; height: 14px; opacity: 0; transform: scale(0.4); transition: opacity 0.15s, transform 0.35s var(--spring); }
.packed .check { background: var(--accent); border-color: var(--accent); }
.packed .check svg { opacity: 1; transform: none; }

.stepper { display: inline-flex; align-items: center; background: var(--fill); border-radius: 8px; }
.stepper button { width: 32px; height: 30px; border: 0; background: transparent; font-size: 17px; line-height: 1; }
.stepper button:disabled { opacity: 0.3; cursor: default; }
.stepper output { min-width: 2.4ch; text-align: center; font: 600 15px var(--font-round); font-variant-numeric: tabular-nums; }

.empty { padding: 32px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.empty strong { color: var(--fg); font: 600 20px var(--font-round); }
.empty .pill { margin-top: 8px; }

/* Footer */
.foot { display: grid; gap: 8px; }
.foot .card { display: grid; overflow: hidden; }
.foot-btn { position: relative; border: 0; background: transparent; text-align: left; padding: 12px 16px; min-height: 48px; color: var(--accent); }
.foot-btn + .foot-btn::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--sep); }
.foot-btn.danger { color: var(--danger); }
.confirm { padding: 14px 16px; display: grid; gap: 12px; }
.confirm p { margin: 0; }
.confirm-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.pill { border: 0; border-radius: 999px; padding: 9px 18px; min-height: 40px; font-weight: 600; background: var(--fill); }
.pill.accent { background: var(--accent); color: var(--on-accent); }
.pill.danger { background: var(--danger); color: #FFFFFF; }
.small { font-size: 13px; color: var(--muted); padding: 0 16px; margin: 0; }
.small a { color: var(--accent); }

/* Toast */
.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--toast); color: var(--on-toast); border-radius: 999px; padding: 10px 10px 10px 18px;
  display: flex; align-items: center; gap: 12px; font-size: 15px; max-width: calc(100% - 32px);
  transition: opacity 0.2s, transform 0.35s var(--spring);
}
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 600; padding: 4px 8px; }
.toast:not(.has-action) { padding-right: 18px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
}
</style>
<style id="standalone">
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>
<main class="wrap">
  <nav class="bar" aria-label="View">
    <span class="seg">
      <button id="tab-plan" aria-pressed="true">Plan</button>
      <button id="tab-pack" aria-pressed="false">Pack</button>
    </span>
  </nav>
  <div id="view" class="view"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-btn" hidden>Undo</button></div>

<script>
(() => {
  const KEY = "packed.v2";
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const uid = () => Math.random().toString(36).slice(2, 9);

  const blank = () => ({ name: "", start: "", whole: [], days: [{ id: uid(), plan: "", items: [] }], items: {}, view: "plan" });

  let state;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) { state = null; }
  if (!state || !Array.isArray(state.days)) state = blank();
  const save = () => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    pendingRemote = null; // a change made here wins over a remote one still waiting
    queueSync();
  };

  let confirming = null; // "new" | "untick"
  let refocus = null;    // add-field id to focus after a render
  let undo = null;
  let pendingRemote = null; // a change from another device, held while you type

  /* ---------- Model ---------- */
  const dayDate = (i) => {
    if (!state.start) return null;
    const d = new Date(state.start + "T12:00:00");
    d.setDate(d.getDate() + i);
    return d;
  };
  const dayTitle = (i) => {
    const d = dayDate(i);
    return d ? d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }) : `Day ${i + 1}`;
  };
  const dayShort = (i) => {
    const d = dayDate(i);
    return d ? d.toLocaleDateString("en-GB", { weekday: "short" }) : `Day ${i + 1}`;
  };
  const target = (key) => (key === "whole" ? state.whole : state.days.find((d) => d.id === key).items);
  const findByName = (name) => Object.keys(state.items).find((id) => state.items[id].name.toLowerCase() === name.toLowerCase());
  const usedIn = (id) => ({
    whole: state.whole.includes(id),
    days: state.days.map((d, i) => (d.items.includes(id) ? i : -1)).filter((i) => i >= 0),
  });
  const gc = () => {
    for (const id of Object.keys(state.items)) {
      const u = usedIn(id);
      if (!u.whole && !u.days.length) delete state.items[id];
    }
  };
  const snapshot = () => JSON.stringify(state);
  const restore = (snap) => { const view = state.view; state = JSON.parse(snap); state.view = view; save(); render(); };

  const addTo = (key, rawName) => {
    const name = rawName.trim().replace(/\s+/g, " ");
    if (!name) return;
    let id = findByName(name);
    if (!id) { id = uid(); state.items[id] = { name, qty: 1, packed: false }; }
    const list = target(key);
    if (!list.includes(id)) list.push(id);
    save();
  };
  const removeFrom = (key, id) => {
    const list = target(key), i = list.indexOf(id);
    if (i >= 0) list.splice(i, 1);
    gc(); save();
  };

  // The pack list: every item, the whole-trip ones first, then in the order the days first use them.
  const packList = () => {
    const order = [];
    state.whole.forEach((id) => order.includes(id) || order.push(id));
    state.days.forEach((d) => d.items.forEach((id) => order.includes(id) || order.push(id)));
    return order.filter((id) => state.items[id]);
  };

  /* ---------- Plan view ---------- */
  const editorHTML = (key, label) => {
    const list = target(key);
    const chips = list.map((id) => {
      const it = state.items[id];
      return `<span class="chip"><span>${esc(it.name)}</span><button class="x" data-remove="${id}" data-key="${key}" aria-label="Remove ${esc(it.name)} from ${esc(label)}">×</button></span>`;
    }).join("");
    return `<div class="chips">${chips}</div>
      <div class="add">
        <span class="plus" aria-hidden="true">+</span>
        <input id="add-${key}" data-key="${key}" type="text" autocomplete="off" enterkeyhint="done"
          placeholder="${key === "whole" ? "Add something you need every day" : "Add what you’ll wear or need"}" aria-label="Add to ${esc(label)}">
        <button class="go" data-go="${key}" hidden>Add</button>
      </div>
      <div class="suggest" id="sug-${key}" hidden></div>`;
  };

  const tripSub = () => {
    const n = state.days.length, parts = [`${n} ${n === 1 ? "day" : "days"}`];
    if (state.start) parts.push(`${dayTitle(0)} to ${dayTitle(n - 1)}`);
    const items = packList().length;
    if (items) parts.push(`${items} ${items === 1 ? "thing" : "things"} to pack`);
    return parts.join(" · ");
  };

  const renderPlan = () => {
    const days = state.days.map((d, i) => {
      const label = dayTitle(i);
      return `<section class="card block" aria-label="${esc(label)}">
        <div class="block-head">
          <h2>${state.start ? `<b>${esc(label)}</b> · Day ${i + 1}` : `<b>Day ${i + 1}</b>`}</h2>
          ${state.days.length > 1 ? `<button class="mini" data-remove-day="${d.id}" aria-label="Remove ${esc(label)}">Remove day</button>` : ""}
        </div>
        <input class="plan" data-plan="${d.id}" id="plan-${d.id}" type="text" value="${esc(d.plan)}" autocomplete="off"
          placeholder="What’s the plan?" aria-label="Plan for ${esc(label)}">
        ${editorHTML(d.id, label)}
      </section>`;
    }).join("");

    const foot = confirming === "new"
      ? `<div class="card confirm"><p>Start a new trip? This clears every day and item in this one.</p>
          <div class="confirm-actions"><button class="pill danger" id="do-new">Clear trip</button><button class="pill" id="cancel">Cancel</button></div></div>`
      : `<div class="card"><button class="foot-btn danger" id="new">Start a new trip</button></div>
         <p class="small" id="sync-note">${syncText()}</p>`;

    $("#view").innerHTML = `
      <header class="head">
        <input id="where" class="where" type="text" value="${esc(state.name)}" placeholder="Where are you going?" autocomplete="off" aria-label="Trip name">
        <div class="sub" id="sub">${tripSub()}</div>
      </header>
      <div class="card field">
        <label for="start">First day</label>
        <span>${state.start ? `<button class="clear-date" id="clear-date">Clear</button> ` : ""}<input id="start" type="date" value="${state.start}"></span>
      </div>
      <section class="card block" aria-label="Whole trip">
        <div class="block-head"><h2><b>Whole trip</b></h2></div>
        <p class="block-intro">Things you use every day, packed once.</p>
        ${editorHTML("whole", "the whole trip")}
      </section>
      ${days}
      <button class="add-day" id="add-day">+ Add ${state.start ? dayTitle(state.days.length) : "a day"}</button>
      <footer class="foot">${foot}</footer>`;
  };

  /* ---------- Pack view ---------- */
  const tickSVG = '<svg viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" fill="none" stroke="var(--on-accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const whenText = (id) => {
    const u = usedIn(id);
    if (u.whole) return "Whole trip";
    const names = u.days.map(dayShort);
    return u.days.length > 1 ? `${names.join(", ")} · ${u.days.length} days` : names[0];
  };

  const renderPack = () => {
    const ids = packList();
    if (!ids.length) {
      $("#view").innerHTML = `<div class="card empty" style="margin-top:8px">
        <strong>Nothing to pack yet</strong>
        Plan your days first. Everything you add there is collected here.
        <button class="pill accent" id="go-plan">Plan your days</button></div>`;
      return;
    }
    const packed = ids.filter((id) => state.items[id].packed).length;
    const rows = ids.map((id) => {
      const it = state.items[id];
      return `<div class="row${it.packed ? " packed" : ""}">
        <button class="tick" data-tick="${id}" aria-pressed="${it.packed}" aria-label="${esc(it.name)}, ${it.qty}">
          <span class="check" aria-hidden="true">${tickSVG}</span>
          <span class="text"><span class="name">${esc(it.name)}</span><span class="when">${esc(whenText(id))}</span></span>
        </button>
        <span class="stepper" role="group" aria-label="How many ${esc(it.name)}">
          <button data-qty="${id}" data-d="-1" aria-label="Fewer" ${it.qty <= 1 ? "disabled" : ""}>−</button>
          <output>${it.qty}</output>
          <button data-qty="${id}" data-d="1" aria-label="More">+</button>
        </span>
      </div>`;
    }).join("");

    const foot = confirming === "untick"
      ? `<div class="card confirm"><p>Untick all ${packed} packed ${packed === 1 ? "thing" : "things"}?</p>
          <div class="confirm-actions"><button class="pill danger" id="do-untick">Untick all</button><button class="pill" id="cancel">Cancel</button></div></div>`
      : `<div class="card"><button class="foot-btn" id="copy">Copy list as text</button>${packed ? `<button class="foot-btn danger" id="untick">Untick everything</button>` : ""}</div>
         <p class="small" id="sync-note">${syncText()}</p>`;

    $("#view").innerHTML = `
      <div class="head">
        <div class="count${packed === ids.length ? " done" : ""}" aria-live="polite">${packed === ids.length ? "Everything’s packed" : `${packed} of ${ids.length} packed`}</div>
        <div class="sub">${esc([state.name.trim(), state.start ? `${dayTitle(0)} to ${dayTitle(state.days.length - 1)}` : ""].filter(Boolean).join(" · "))}</div>
      </div>
      <div class="card list">${rows}</div>
      <footer class="foot">${foot}</footer>`;
  };

  /* ---------- Render ---------- */
  const render = () => {
    const n = packList().length;
    $("#tab-plan").setAttribute("aria-pressed", state.view === "plan");
    $("#tab-pack").setAttribute("aria-pressed", state.view === "pack");
    $("#tab-pack").textContent = n ? `Pack (${n})` : "Pack";
    if (state.view === "plan") renderPlan(); else renderPack();
    document.title = state.name.trim() ? `Packed · ${state.name.trim()}` : "Packed";
    if (refocus) { const el = document.getElementById(refocus); if (el) { el.focus(); showSuggest(el); } refocus = null; }
  };

  // Things already in the trip that aren't in this day yet, so one item can be reused across days.
  const showSuggest = (input) => {
    const key = input.dataset.key, box = $("#sug-" + key), go = document.querySelector(`[data-go="${key}"]`);
    const q = input.value.trim().toLowerCase();
    if (go) go.hidden = !q;
    const here = target(key);
    const pool = packList().filter((id) => !here.includes(id) && (!q || state.items[id].name.toLowerCase().includes(q)));
    if (!pool.length || key === "whole" && !q) { box.hidden = true; box.innerHTML = ""; return; }
    box.innerHTML = `<p>${q ? "Already in your trip" : "Reuse from your trip"}</p>
      <div class="chips">${pool.slice(0, 14).map((id) => `<button data-reuse="${id}" data-key="${key}">${esc(state.items[id].name)}</button>`).join("")}</div>`;
    box.hidden = false;
  };
  const hideSuggest = (input) => {
    const key = input.dataset.key, box = $("#sug-" + key);
    if (box) { box.hidden = true; box.innerHTML = ""; }
  };

  /* ---------- Events ---------- */
  $("#tab-plan").onclick = () => { state.view = "plan"; confirming = null; save(); render(); window.scrollTo(0, 0); };
  $("#tab-pack").onclick = () => { state.view = "pack"; confirming = null; save(); render(); window.scrollTo(0, 0); };

  const view = $("#view");

  view.addEventListener("input", (e) => {
    const t = e.target;
    if (t.id === "where") { state.name = t.value; save(); document.title = t.value.trim() ? `Packed · ${t.value.trim()}` : "Packed"; return; }
    if (t.dataset.plan) { state.days.find((d) => d.id === t.dataset.plan).plan = t.value; save(); return; }
    if (t.dataset.key) showSuggest(t);
  });
  view.addEventListener("change", (e) => {
    if (e.target.id === "start") { state.start = e.target.value; save(); render(); }
  });
  view.addEventListener("focusin", (e) => { if (e.target.dataset.key) showSuggest(e.target); });
  view.addEventListener("focusout", (e) => {
    const t = e.target;
    if (!t.dataset.key) return;
    // Let a tap on a suggestion land before the list closes.
    setTimeout(() => { if (document.activeElement !== t) hideSuggest(t); }, 150);
  });
  view.addEventListener("focusout", () => {
    setTimeout(() => {
      if (pendingRemote && !typing()) { const data = pendingRemote; pendingRemote = null; applyRemote(data); }
    }, 200);
  });
  view.addEventListener("keydown", (e) => {
    const t = e.target;
    if (e.key !== "Enter" || !t.dataset.key) return;
    e.preventDefault();
    if (!t.value.trim()) return;
    addTo(t.dataset.key, t.value);
    refocus = t.id; render();
  });
  // Keep focus in the field when tapping a suggestion or Add.
  view.addEventListener("pointerdown", (e) => { if (e.target.closest("[data-reuse], [data-go]")) e.preventDefault(); });

  view.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const d = b.dataset;

    if (d.reuse) { addTo(d.key, state.items[d.reuse].name); refocus = "add-" + d.key; render(); return; }
    if (d.go) { const inp = $("#add-" + d.go); addTo(d.go, inp.value); refocus = inp.id; render(); return; }
    if (d.remove) {
      const snap = snapshot(), name = state.items[d.remove].name;
      removeFrom(d.key, d.remove); render();
      toast(`Removed ${name}`, () => restore(snap));
      return;
    }
    if (d.removeDay) {
      const snap = snapshot(), i = state.days.findIndex((x) => x.id === d.removeDay), label = dayTitle(i);
      state.days.splice(i, 1); gc(); save(); render();
      toast(`Removed ${label}`, () => restore(snap));
      return;
    }
    if (d.tick) {
      const it = state.items[d.tick]; it.packed = !it.packed; save();
      const y = window.scrollY; render(); window.scrollTo(0, y);
      return;
    }
    if (d.qty) {
      const it = state.items[d.qty]; it.qty = Math.max(1, Math.min(99, it.qty + Number(d.d))); save();
      const y = window.scrollY; render(); window.scrollTo(0, y);
      return;
    }

    switch (b.id) {
      case "add-day": {
        const day = { id: uid(), plan: "", items: [] };
        state.days.push(day); save(); refocus = "plan-" + day.id; render(); break;
      }
      case "clear-date": state.start = ""; save(); render(); break;
      case "go-plan": state.view = "plan"; save(); render(); break;
      case "new": confirming = "new"; render(); $("#do-new").focus(); break;
      case "untick": confirming = "untick"; render(); $("#do-untick").focus(); break;
      case "cancel": confirming = null; render(); break;
      case "do-new": {
        const snap = snapshot(); confirming = null; state = blank(); save(); render(); window.scrollTo(0, 0);
        toast("Trip cleared", () => restore(snap)); break;
      }
      case "do-untick":
        Object.values(state.items).forEach((it) => { it.packed = false; });
        confirming = null; save(); render(); toast("Everything unticked"); break;
      case "copy": copyList(); break;
    }
  });

  const copyList = () => {
    const lines = [state.name.trim() || "My trip", ""];
    packList().forEach((id) => {
      const it = state.items[id];
      lines.push(`${it.packed ? "✓" : "–"} ${it.name}${it.qty > 1 ? " ×" + it.qty : ""}`);
    });
    const text = lines.join("\n");
    const fallback = () => {
      const ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
      ta.remove();
      toast(ok ? "List copied" : "Couldn’t copy. Your browser blocked it.");
    };
    try { navigator.clipboard.writeText(text).then(() => toast("List copied"), fallback); } catch (e) { fallback(); }
  };

  /* ---------- Toast ---------- */
  let toastTimer;
  const toast = (msg, action) => {
    const el = $("#toast"), btn = $("#toast-btn");
    $("#toast-text").textContent = msg;
    btn.hidden = !action;
    el.classList.toggle("has-action", !!action);
    undo = action || null;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove("show"); undo = null; }, action ? 5000 : 2200);
  };
  $("#toast-btn").onclick = () => { if (undo) undo(); undo = null; $("#toast").classList.remove("show"); };

  /* ---------- Sync across devices ----------
     Inside Claude, the plan is kept in this artifact's private per-person store, so the same
     person sees it on every device. Elsewhere (the Lab's GitHub Pages copy) it stays in this browser. */
  const ARTIFACT_URL = "https://claude.ai/artifact/B6fncirqAZDzv2kv8ckzdi";
  const outsideClaude = /(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname) || location.protocol === "file:";
  let sync = outsideClaude ? "elsewhere" : "connecting"; // elsewhere | connecting | on | offline | signed-out
  let ref = null, writing = false, dirty = false, syncTimer = null, decided = false;

  const shared = () => { const { view, ...rest } = state; return rest; };
  const hasItems = (s) => !!(s && s.items && Object.keys(s.items).length);
  const typing = () => { const a = document.activeElement; return !!(a && a.tagName === "INPUT" && view.contains(a)); };

  function syncText() {
    switch (sync) {
      case "on": return "Saved to your Claude account, so it’s the same on all your devices.";
      case "connecting": return "Connecting to your Claude account…";
      case "offline": return "Can’t reach your Claude account right now. Changes are saved on this device and sync when it’s back.";
      case "signed-out": return "Saved on this device only. Sign in to Claude to have your plan on all your devices.";
      default: return `Saved on this device only. <a href="${ARTIFACT_URL}" target="_blank" rel="noopener">Open Packed in Claude</a> to have your plan on all your devices.`;
    }
  }
  const renderSync = () => { document.querySelectorAll("#sync-note").forEach((el) => { el.innerHTML = syncText(); }); };

  function queueSync() {
    if (!ref) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(push, 500);
  }
  async function push() {
    if (!ref) return;
    if (writing) { dirty = true; return; }
    writing = true; dirty = false;
    try {
      await ref.set(JSON.parse(JSON.stringify(shared())));
    } catch (e) {
      const code = e && e.code;
      if (code === "unavailable") { dirty = true; await new Promise((r) => setTimeout(r, 1500 + Math.random() * 1500)); }
      else { ref = null; sync = code === "invalid_argument" ? "signed-out" : "offline"; renderSync(); }
    }
    writing = false;
    if (dirty && ref) push();
  }
  function applyRemote(data) {
    state = { ...JSON.parse(JSON.stringify(data)), view: state.view };
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
    const y = window.scrollY; render(); window.scrollTo(0, y);
  }

  (async () => {
    if (sync === "elsewhere") return;
    for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise((r) => setTimeout(r, 100));
    if (!(window.claude && window.claude.use)) { sync = "elsewhere"; renderSync(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const id = user ? await user.id() : null;
    if (!db || !id) { sync = "signed-out"; renderSync(); return; }
    ref = db.doc("data/users/" + id + "/trip");
    const slow = setTimeout(() => { if (!decided) { sync = "offline"; renderSync(); } }, 10000);
    ref.onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
      clearTimeout(slow);
      sync = "on";
      const data = snap.exists ? snap.data() : null;
      if (!decided) {
        decided = true;
        // First answer from the account: if only this device has a plan, upload it instead of wiping it.
        if (!hasItems(data) && (hasItems(state) || !data)) { push(); renderSync(); return; }
      }
      if (!data || JSON.stringify(data) === JSON.stringify(shared())) { renderSync(); return; }
      if (typing()) { pendingRemote = data; renderSync(); return; }
      applyRemote(data);
    }, () => { clearTimeout(slow); ref = null; sync = "offline"; renderSync(); });
  })();

  render();
})();
</script>
</body>
</html>
