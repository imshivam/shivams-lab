<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Packed</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Pack one step at a time, from a plan Claude sorts out of what you say.">
<style>
/* Layout: one calm column. Pack = one step on screen at a time, in the order things should go in.
   Days = the trip a day at a time, to check each day's things are packed. The plan itself is written
   by Claude from what Shivam says; this page only ticks, answers and adds. */
:root {
  --bg: #F2F3F5;
  --card: #FFFFFF;
  --fg: #1D1D1F;
  --muted: #6C6F75;
  --sep: rgba(60, 64, 72, 0.16);
  --fill: rgba(118, 122, 132, 0.12);
  --ring: rgba(60, 64, 72, 0.34);
  --bar: rgba(242, 243, 245, 0.86);
  --seg-on: #FFFFFF;
  --accent: #0A7A72;
  --accent-soft: rgba(10, 122, 114, 0.12);
  --on-accent: #FFFFFF;
  --sug: #8A5A00;
  --sug-soft: rgba(196, 136, 0, 0.12);
  --danger: #D70015;
  --toast: #1D1D1F;
  --on-toast: #F5F5F7;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --r: 14px;
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --card: #1C1C1E; --fg: #F5F5F7; --muted: #98989F;
    --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --ring: rgba(235, 235, 245, 0.36);
    --bar: rgba(0, 0, 0, 0.82); --seg-on: #636366; --accent: #3CCBBE; --accent-soft: rgba(60, 203, 190, 0.16); --on-accent: #00201D;
    --sug: #FFC861; --sug-soft: rgba(255, 200, 97, 0.14);
    --danger: #FF453A; --toast: #F5F5F7; --on-toast: #1D1D1F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #1C1C1E; --fg: #F5F5F7; --muted: #98989F;
  --sep: rgba(84, 84, 88, 0.55); --fill: rgba(118, 118, 128, 0.24); --ring: rgba(235, 235, 245, 0.36);
  --bar: rgba(0, 0, 0, 0.82); --seg-on: #636366; --accent: #3CCBBE; --accent-soft: rgba(60, 203, 190, 0.16); --on-accent: #00201D;
  --sug: #FFC861; --sug-soft: rgba(255, 200, 97, 0.14);
  --danger: #FF453A; --toast: #F5F5F7; --on-toast: #1D1D1F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 17px/1.35 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
[hidden] { display: none !important; }

.wrap {
  max-width: 640px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 72px;
}
.view { display: grid; gap: 20px; }

/* Top bar */
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  margin-bottom: 8px;
  background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  display: flex; justify-content: center;
}
.seg { display: inline-grid; grid-template-columns: 1fr 1fr; background: var(--fill); border-radius: 9px; padding: 2px; width: min(100%, 320px); }
.seg button {
  border: 0; background: transparent; border-radius: 7px; padding: 6px 12px; font-size: 14px; font-weight: 500; min-height: 32px;
  transition: background-color 0.2s;
}
.seg button[aria-pressed="true"] { background: var(--seg-on); box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12); font-weight: 600; }

/* Trip header */
.head { display: grid; gap: 4px; padding-top: 8px; }
.head h1 { margin: 0; font: 700 34px/1.15 var(--font-round); letter-spacing: -0.01em; }
.sub { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; }
.card { background: var(--card); border-radius: var(--r); }
.small { margin: 0; font-size: 13px; color: var(--muted); text-align: center; }
.small a { color: var(--accent); }

/* Step rail: where you are in the run */
.rail { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding: 2px 16px 4px; scroll-padding-inline: 16px; }
.rail::-webkit-scrollbar { display: none; }
.rail button {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 6px;
  border: 0; background: var(--card); border-radius: 999px; padding: 6px 12px 6px 6px; min-height: 36px; font-size: 14px; color: var(--muted);
}
.rail .n {
  width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600;
  background: var(--fill); color: var(--fg); font-variant-numeric: tabular-nums;
}
.rail button.done .n { background: var(--accent); color: var(--on-accent); }
.rail button[aria-current="step"] { color: var(--fg); font-weight: 600; box-shadow: inset 0 0 0 1.5px var(--accent); }

/* The step */
.step { padding: 18px 16px 6px; display: grid; gap: 4px; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); font-variant-numeric: tabular-nums; }
.step h2 { margin: 0; font: 700 24px/1.2 var(--font-round); }
.why { margin: 2px 0 6px; color: var(--muted); font-size: 15px; }
.meter { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin: 6px 0 4px; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.35s ease; }

.list { list-style: none; margin: 0; padding: 0; }
.row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-top: 0.5px solid var(--sep); }
.row:first-child { border-top: 0; }
.tick {
  flex: 0 0 auto; width: 28px; height: 28px; margin-top: -2px; border-radius: 50%; border: 1.5px solid var(--ring); background: transparent;
  display: grid; place-items: center; padding: 0; transition: background-color 0.2s, border-color 0.2s;
}
.tick svg { width: 15px; height: 15px; opacity: 0; transform: scale(0.5); transition: opacity 0.15s, transform 0.3s var(--spring); }
.row.on .tick { background: var(--accent); border-color: var(--accent); }
.row.on .tick svg { opacity: 1; transform: none; }
.row .txt { flex: 1; min-width: 0; display: grid; gap: 2px; cursor: pointer; }
.row .name { overflow-wrap: anywhere; }
.row .qty { color: var(--muted); font-variant-numeric: tabular-nums; }
.row .note { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.row .note.answer { color: var(--fg); }
.row .note.unset { color: var(--sug); }
.row.on .name { color: var(--muted); }
.x {
  flex: 0 0 auto; border: 0; background: transparent; width: 28px; height: 28px; margin-top: -2px; border-radius: 50%;
  display: grid; place-items: center; color: var(--muted); font-size: 19px; line-height: 1;
}
.x:hover { background: var(--fill); color: var(--fg); }

.subhead { margin: 14px 0 0; font-size: 13px; font-weight: 600; color: var(--sug); display: flex; align-items: center; gap: 6px; }
.subhead::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--sug); }
.row.sug .tick { border-style: dashed; }

/* Decisions */
.dec { padding: 12px 0 14px; border-top: 0.5px solid var(--sep); display: grid; gap: 8px; }
.dec:first-child { border-top: 0; }
.dec-head { display: flex; align-items: flex-start; gap: 12px; }
.dec-head .tick { pointer-events: none; }
.dec.on .tick { background: var(--accent); border-color: var(--accent); }
.dec.on .tick svg { opacity: 1; transform: none; }
.dec .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.dec .name { font-weight: 600; }
.dec .hint { font-size: 14px; color: var(--muted); }
.dec-body { display: grid; gap: 8px; padding-left: 40px; }
.opts { display: flex; flex-wrap: wrap; gap: 6px; }
.opts button {
  border: 0; background: var(--fill); border-radius: 999px; padding: 7px 14px; font-size: 15px; min-height: 36px;
  transition: background-color 0.2s, color 0.2s;
}
.opts button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.answer-in {
  width: 100%; border: 0; background: var(--fill); border-radius: 10px; padding: 10px 12px; font-size: 16px; resize: none;
  min-height: 44px; line-height: 1.35;
}
.answer-in::placeholder { color: var(--muted); }

/* Add something to this step */
.add { display: flex; align-items: center; gap: 8px; border-top: 0.5px solid var(--sep); padding: 8px 0 10px; }
.add .plus { color: var(--accent); font-size: 22px; line-height: 1; width: 28px; text-align: center; }
.add input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 6px 0; font-size: 16px; }
.add input::placeholder { color: var(--muted); }
.add input:focus-visible { outline: none; }
.add .go { border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 14px; font-weight: 600; padding: 5px 12px; }

/* Back / Next */
.nav { display: grid; grid-template-columns: auto 1fr; gap: 10px; }
.btn {
  border: 0; border-radius: 12px; min-height: 50px; padding: 12px 18px; font-size: 17px; font-weight: 600;
  background: var(--card); color: var(--accent);
}
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.4; cursor: default; }
.link { border: 0; background: transparent; color: var(--accent); font-size: 15px; padding: 8px 4px; min-height: 44px; }

.dump-open {
  width: 100%; border: 1.5px dashed var(--ring); background: transparent; border-radius: var(--r); padding: 14px 16px; min-height: 52px;
  font-size: 16px; color: var(--accent); font-weight: 600; text-align: left; display: grid; gap: 2px;
}
.dump-open span { font-weight: 400; color: var(--muted); font-size: 14px; }

/* Finished */
.finish { padding: 28px 20px; text-align: center; display: grid; gap: 8px; justify-items: center; }
.finish .big { width: 64px; height: 64px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; animation: pop 0.5s var(--spring); }
.finish h2 { margin: 6px 0 0; font: 700 26px/1.2 var(--font-round); }
.finish p { margin: 0; color: var(--muted); }
@keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: none; opacity: 1; } }

/* Days */
.facts { padding: 14px 16px; display: grid; gap: 8px; }
.facts h2, .day .eyebrow { margin: 0; }
.facts ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 15px; }
.day { padding: 14px 16px; display: grid; gap: 8px; }
.day-top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.day h3 { margin: 0; font-size: 20px; font-weight: 700; }
.pill { font-size: 13px; font-weight: 600; border-radius: 999px; padding: 3px 10px; white-space: nowrap; background: var(--fill); color: var(--muted); }
.pill.ok { background: var(--accent-soft); color: var(--accent); }
.lines { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 15px; }
.lines dt { color: var(--muted); }
.lines dd { margin: 0; overflow-wrap: anywhere; }
.lines dd.unset { color: var(--sug); }
.day.today { box-shadow: inset 0 0 0 1.5px var(--accent); }

/* Empty state (outside Claude, or before the plan arrives) */
.empty { padding: 28px 20px; text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty h2 { margin: 0; font: 700 22px/1.2 var(--font-round); }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }

.foot { display: grid; gap: 10px; justify-items: center; padding-top: 8px; }
.confirm { padding: 14px 16px; display: grid; gap: 10px; }
.confirm p { margin: 0; font-size: 15px; }
.confirm .row2 { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.confirm .danger { background: var(--danger); color: #fff; }

/* Brain dump sheet */
dialog {
  border: 0; padding: 0; background: var(--card); color: var(--fg); border-radius: 18px;
  width: min(560px, calc(100vw - 24px)); max-height: calc(100dvh - 48px); overflow: auto;
}
dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
.sheet { padding: 18px 16px 16px; display: grid; gap: 12px; }
.sheet h2 { margin: 0; font: 700 22px/1.2 var(--font-round); }
.sheet p { margin: 0; color: var(--muted); font-size: 15px; }
.sheet textarea { width: 100%; min-height: 160px; border: 0; background: var(--fill); border-radius: 12px; padding: 12px; font-size: 17px; resize: vertical; }
.sheet .acts { display: flex; gap: 8px; justify-content: flex-end; }
.sorted { list-style: none; margin: 0; padding: 0; }
.sorted li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 0.5px solid var(--sep); font-size: 16px; }
.sorted li:first-child { border-top: 0; }
.sorted small { color: var(--muted); font-size: 14px; white-space: nowrap; }

.toast {
  position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 20;
  transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--toast); color: var(--on-toast); border-radius: 999px; padding: 10px 10px 10px 18px;
  display: flex; align-items: center; gap: 12px; font-size: 15px; max-width: calc(100vw - 32px);
  transition: opacity 0.2s, transform 0.3s var(--spring);
}
.toast:not(.has-action) { padding-right: 18px; }
.toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
.toast button { border: 0; background: transparent; color: var(--accent); font-weight: 600; font-size: 15px; padding: 4px 8px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast button { color: #0A7A72; } }
:root[data-theme="dark"] .toast button { color: #0A7A72; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
<style id="standalone">
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
</style>
</head>
<body>

<main class="wrap">
  <nav class="bar" aria-label="View">
    <span class="seg">
      <button id="tab-pack" aria-pressed="true">Pack</button>
      <button id="tab-days" aria-pressed="false">Days</button>
    </span>
  </nav>
  <div class="view" id="view"></div>
</main>

<dialog id="dump" aria-labelledby="dump-title">
  <form class="sheet" method="dialog" id="dump-form">
    <h2 id="dump-title">Thought of something?</h2>
    <p>Say or type anything, as it comes to you. Claude splits it into things and puts each one in the right step.</p>
    <textarea id="dump-text" placeholder="Tap the mic on your keyboard and talk"></textarea>
    <ul class="sorted" id="dump-out" hidden></ul>
    <p id="dump-msg" hidden></p>
    <div class="acts">
      <button class="btn" value="cancel" formnovalidate>Cancel</button>
      <button class="btn primary" id="dump-go" type="button">Sort it</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button id="toast-btn" hidden>Undo</button></div>

<script>
(() => {
  "use strict";
  const KEY = "packed.v3";
  const ARTIFACT_URL = "https://claude.ai/artifact/B6fncirqAZDzv2kv8ckzdi";
  const outsideClaude = /(^|\.)github\.io$|^localhost$|^127\./.test(location.hostname) || location.protocol === "file:";
  const SHORT = { decide: "Decide", charge: "Charge", layout: "Lay out", big: "Big bag", cabin: "Cabin bag", morning: "Morning", door: "Door" };
  const TICK = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  const $ = (s) => document.querySelector(s);
  const view = $("#view");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const isObj = (v) => v && typeof v === "object" && !Array.isArray(v);
  const clone = (v) => JSON.parse(JSON.stringify(v));
  function merge(t, s) {
    for (const k of Object.keys(s)) {
      if (isObj(s[k]) && isObj(t[k])) merge(t[k], s[k]);
      else t[k] = isObj(s[k]) ? clone(s[k]) : s[k];
    }
    return t;
  }
  const normal = (p) => ({ done: {}, answers: {}, dismissed: {}, added: {}, ...(isObj(p) ? clone(p) : {}) });

  /* ---------- State ---------- */
  let cache = {};
  try { cache = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) {}
  let plan = isObj(cache.plan) && Array.isArray(cache.plan.steps) ? cache.plan : null;
  let prog = normal(cache.progress);
  let tab = cache.tab === "days" ? "days" : "pack";
  let at = typeof cache.at === "string" ? cache.at : null; // id of the step on screen
  let confirming = false;
  let outbox = isObj(cache.outbox) ? cache.outbox : null; // changes not yet confirmed by the account
  const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify({ plan, progress: prog, outbox, tab, at })); } catch (e) {} };

  const answer = (id) => String(prog.answers[id] || "").trim();
  const hidden = (it) => Array.isArray(it.hideIf) && answer(it.hideIf[0]) === it.hideIf[1];
  const added = (stepId) => Object.entries(prog.added)
    .filter(([, a]) => isObj(a) && !a.gone && a.step === stepId)
    .sort((a, b) => (a[1].at || 0) - (b[1].at || 0))
    .map(([id, a]) => ({ id, name: a.name, note: a.note, mine: true }));
  const items = (step) => [...step.items.filter((it) => !hidden(it) && !(it.sug && prog.dismissed[it.id])), ...added(step.id)];
  const isDone = (it) => it.kind === "decide" ? !!answer(it.id) : !!prog.done[it.id];
  const count = (step) => { const all = items(step); return { done: all.filter(isDone).length, total: all.length }; };
  const complete = (step) => { const c = count(step); return c.total > 0 && c.done === c.total; };
  const allItems = () => plan ? plan.steps.flatMap((s) => s.items) : [];
  const byId = (id) => allItems().find((it) => it.id === id);
  const stepIndex = () => {
    if (!plan) return 0;
    const i = plan.steps.findIndex((s) => s.id === at);
    if (i >= 0) return i;
    const first = plan.steps.findIndex((s) => !complete(s));
    return first < 0 ? plan.steps.length : first;
  };

  /* ---------- Writing progress ----------
     Each change is a small nested patch merged into the progress doc, so ticks from the
     iPad and the iPhone at the same time don't overwrite each other. One write at a time. */
  let progRef = null, writing = false;
  function patch(p) {
    merge(prog, p);
    outbox = merge(outbox || {}, p);
    saveLocal();
    flush();
  }
  async function flush() {
    if (writing || !outbox || !progRef) return;
    writing = true;
    const sent = JSON.stringify(outbox);
    try {
      await progRef.update(JSON.parse(sent));
      if (JSON.stringify(outbox) === sent) outbox = null; // anything added meanwhile goes next
      saveLocal(); setSync("on");
    } catch (e) {
      const code = e && e.code;
      if (code === "invalid_argument") { try { await progRef.set(clone(prog)); outbox = null; saveLocal(); } catch (e2) {} }
      else { setSync("offline"); setTimeout(() => { writing = false; flush(); }, 4000); return; }
    }
    writing = false;
    if (outbox) flush();
  }

  /* ---------- Rendering ---------- */
  const fmtDay = (iso, long) => {
    const d = new Date(iso + "T12:00:00");
    return d.toLocaleDateString("en-GB", long ? { weekday: "long", day: "numeric", month: "long" } : { weekday: "short", day: "numeric", month: "short" });
  };
  const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

  function render() {
    $("#tab-pack").setAttribute("aria-pressed", tab === "pack");
    $("#tab-days").setAttribute("aria-pressed", tab === "days");
    if (!plan) { view.innerHTML = emptyHTML(); return; }
    view.innerHTML = tab === "pack" ? packHTML() : daysHTML();
  }

  function emptyHTML() {
    const inClaude = sync !== "elsewhere";
    return `
      <div class="head"><h1>Packed</h1></div>
      <div class="card empty">
        <h2>${inClaude && sync === "connecting" ? "Getting your trip…" : "Your trip lives in Claude"}</h2>
        <p>${inClaude
          ? (sync === "connecting" ? "One moment." : "Tell Claude where you're going and everything you'll need, and it'll set up the steps here.")
          : `Your plan is kept in your Claude account. <a href="${ARTIFACT_URL}" target="_blank" rel="noopener">Open Packed in Claude</a>.`}</p>
      </div>
      <p class="small" id="sync-note">${syncText()}</p>`;
  }

  function header() {
    return `<div class="head"><h1>${esc(plan.title)}</h1><div class="sub">${esc(plan.sub || "")}</div></div>`;
  }

  function packHTML() {
    const steps = plan.steps;
    const i = stepIndex();
    const rail = `<div class="rail" role="list">${steps.map((s, n) => `
      <button role="listitem" data-act="go" data-step="${esc(s.id)}" class="${complete(s) ? "done" : ""}" ${n === i ? 'aria-current="step"' : ""}>
        <span class="n">${complete(s) ? TICK : n + 1}</span>${esc(SHORT[s.id] || s.title)}
      </button>`).join("")}</div>`;

    if (i >= steps.length) {
      return `${header()}${rail}
        <div class="card finish">
          <div class="big"><svg viewBox="0 0 16 16" width="30" height="30" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h2>All packed</h2>
          <p>Every step is done. Have a good trip.</p>
          <button class="link" data-act="tab" data-tab="days">Walk through the days once more</button>
        </div>
        ${footer()}`;
    }

    const s = steps[i];
    const c = count(s);
    const list = items(s);
    const own = list.filter((it) => !it.sug);
    const sug = list.filter((it) => it.sug);
    const pct = c.total ? Math.round((c.done / c.total) * 100) : 0;
    const next = steps[i + 1];
    return `${header()}${rail}
      <section class="card step" aria-labelledby="step-title">
        <div class="eyebrow">Step ${i + 1} of ${steps.length} · ${c.done} of ${c.total} done</div>
        <h2 id="step-title">${esc(s.title)}</h2>
        <p class="why">${esc(s.why || "")}</p>
        <div class="meter" aria-hidden="true"><i style="width:${pct}%"></i></div>
        <ul class="list">${own.map(rowHTML).join("")}</ul>
        ${sug.length ? `<p class="subhead">You didn't mention these</p><ul class="list">${sug.map(rowHTML).join("")}</ul>` : ""}
        <form class="add" data-step="${esc(s.id)}" autocomplete="off">
          <span class="plus" aria-hidden="true">+</span>
          <input name="name" placeholder="Add something to this step" aria-label="Add something to this step" enterkeyhint="done">
          <button class="go" hidden>Add</button>
        </form>
      </section>
      <div class="nav">
        <button class="btn" data-act="go" data-step="${esc(steps[i - 1] ? steps[i - 1].id : "")}" ${i === 0 ? "disabled" : ""}>Back</button>
        <button class="btn ${complete(s) ? "primary" : ""}" data-act="go" data-step="${esc(next ? next.id : "__end")}">${next ? "Next: " + esc(SHORT[next.id] || next.title) : "Finish"}</button>
      </div>
      ${canSort ? `<button class="dump-open" data-act="dump">Thought of something?<span>Say it, and Claude puts it in the right step.</span></button>` : ""}
      ${footer()}`;
  }

  function rowHTML(it) {
    if (it.kind === "decide") return decisionHTML(it);
    const on = isDone(it);
    let note = it.note ? `<span class="note">${esc(it.note)}</span>` : "";
    if (it.from) {
      const a = answer(it.from);
      note = (a ? `<span class="note answer">${esc(a)}</span>` : `<span class="note unset">Not decided yet, see step 1</span>`) + (it.note ? `<span class="note">${esc(it.note)}</span>` : "");
    }
    if (it.sug) note = `<span class="note">${esc(it.sug)}</span>`;
    return `<li class="row ${on ? "on" : ""} ${it.sug ? "sug" : ""}" data-id="${esc(it.id)}">
      <button class="tick" data-act="tick" aria-pressed="${on}" aria-label="${esc(it.name)}${on ? ", packed" : ""}">${TICK}</button>
      <span class="txt" data-act="tick"><span class="name">${esc(it.name)}${it.qty ? ` <span class="qty">· ${esc(it.qty)}</span>` : ""}</span>${note}</span>
      ${it.sug || it.mine ? `<button class="x" data-act="drop" aria-label="Not taking ${esc(it.name)}">×</button>` : ""}
    </li>`;
  }

  function decisionHTML(it) {
    const a = answer(it.id);
    const opts = it.options || [];
    const typed = a && !opts.includes(a) ? a : "";
    return `<div class="dec ${a ? "on" : ""}" data-id="${esc(it.id)}">
      <div class="dec-head">
        <span class="tick" aria-hidden="true">${TICK}</span>
        <div class="txt"><span class="name">${esc(it.name)}</span>${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ""}</div>
      </div>
      <div class="dec-body">
        ${opts.length ? `<div class="opts">${opts.map((o) => `<button data-act="opt" data-val="${esc(o)}" aria-pressed="${a === o}">${esc(o)}</button>`).join("")}</div>` : ""}
        <textarea class="answer-in" rows="1" data-act="answer" placeholder="${opts.length ? "Or say it in your own words" : "What will you wear?"}" aria-label="${esc(it.name)}">${esc(typed)}</textarea>
      </div>
    </div>`;
  }

  function daysHTML() {
    const today = todayIso();
    const eventDay = answer("d-eventday");
    const boots = answer("d-boots");
    const facts = (plan.facts || []).length ? `
      <section class="card facts" aria-label="Good to know">
        <h2 class="eyebrow">Good to know</h2>
        <ul>${plan.facts.map((f) => `<li>${esc(f)}</li>`).join("")}</ul>
      </section>` : "";
    const cards = (plan.days || []).map((d) => {
      const rows = [];
      const uses = [...(d.uses || [])];
      const wear = d.wear ? answer(d.wear) : "";
      const wearName = d.wear && byId(d.wear) ? byId(d.wear).name : "";
      if (d.wear) rows.push(["Wear", wear || `${wearName}: not decided`, !wear]);
      if (d.event) {
        if (!eventDay) rows.push(["Evening", "The event, if it's today. Pick the day in step 1.", true]);
        else if (eventDay === d.event) {
          const ev = answer("d-event");
          rows.push(["Evening", "Event: " + (ev || "outfit not decided"), !ev]);
          uses.push("w-event"); if (boots !== "Buy in Barcelona on Sat 7") uses.push("w-boots");
        }
      }
      if (d.ifBoots && boots === "Buy in Barcelona on Sat 7") rows.push(["Shop", "Buy dress boots for the event", false]);
      (d.lines || []).forEach((l) => { const [k, ...v] = l.split(": "); rows.push(v.length ? [k, v.join(": "), false] : ["", l, false]); });
      if (d.gym) { rows.push(["Gym", `Workout set ${d.gym}, shoes and socks`, false]); uses.push("w-gym", "w-gymshoes", "w-gymsocks"); }
      if (d.night) { rows.push(["Night", `Pyjamas, set ${d.night}`, false]); uses.push("w-pj"); }
      const need = [...new Set(uses)].map(byId).filter((it) => it && !hidden(it));
      const left = need.filter((it) => !isDone(it)).length;
      return `<section class="card day ${d.date === today ? "today" : ""}">
        <div class="day-top">
          <div><div class="eyebrow">${esc(fmtDay(d.date))}${d.date === today ? " · Today" : ""}</div><h3>${esc(d.plan)}</h3></div>
          <span class="pill ${left ? "" : "ok"}">${need.length ? (left ? `${left} to pack` : "Packed") : ""}</span>
        </div>
        <dl class="lines">${rows.map(([k, v, unset]) => `<dt>${esc(k)}</dt><dd class="${unset ? "unset" : ""}">${esc(v)}</dd>`).join("")}</dl>
      </section>`;
    }).join("");
    return `${header()}${facts}${cards}${footer()}`;
  }

  function footer() {
    return `<div class="foot">
      <p class="small" id="sync-note">${syncText()}</p>
      ${confirming ? `<div class="card confirm">
          <p>Clear every tick and answer? Your items stay, ready for the next trip.</p>
          <div class="row2"><button class="btn" data-act="reset-no">Keep</button><button class="btn danger" data-act="reset-yes">Clear</button></div>
        </div>` : `<button class="link" data-act="reset">Start packing again</button>`}
    </div>`;
  }

  /* ---------- Actions ---------- */
  const tickRow = (id) => {
    const on = !prog.done[id];
    patch({ done: { [id]: on } });
    const row = view.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (row) { row.classList.toggle("on", on); row.querySelector(".tick").setAttribute("aria-pressed", on); }
    refreshCounts();
  };
  // Update counts and the rail in place, so a tick doesn't rebuild the list under your finger.
  function refreshCounts() {
    if (tab !== "pack" || !plan) return;
    const i = stepIndex(); const s = plan.steps[i]; if (!s) return;
    const c = count(s);
    const eb = view.querySelector(".step .eyebrow"); if (eb) eb.textContent = `Step ${i + 1} of ${plan.steps.length} · ${c.done} of ${c.total} done`;
    const m = view.querySelector(".meter i"); if (m) m.style.width = (c.total ? Math.round(c.done / c.total * 100) : 0) + "%";
    view.querySelectorAll(".rail button").forEach((b, n) => {
      const st = plan.steps[n]; const d = complete(st);
      b.classList.toggle("done", d); b.querySelector(".n").innerHTML = d ? TICK : n + 1;
    });
    const nextBtn = view.querySelectorAll(".nav .btn")[1]; if (nextBtn) nextBtn.classList.toggle("primary", complete(s));
  }

  view.addEventListener("click", (e) => {
    const el = e.target.closest("[data-act]");
    if (!el) return;
    const act = el.dataset.act;
    const row = el.closest("[data-id]");
    switch (act) {
      case "tick": if (row) tickRow(row.dataset.id); break;
      case "opt": {
        const id = row.dataset.id; const val = el.dataset.val;
        const nv = answer(id) === val ? "" : val;
        patch({ answers: { [id]: nv } });
        const y = window.scrollY; render(); window.scrollTo(0, y);
        break;
      }
      case "drop": {
        const id = row.dataset.id;
        const isMine = !!(prog.added[id]);
        if (isMine) patch({ added: { [id]: { gone: true } } }); else patch({ dismissed: { [id]: true } });
        const name = row.querySelector(".name").firstChild.textContent;
        render();
        toast(`Not taking ${name}`, () => { if (isMine) patch({ added: { [id]: { gone: false } } }); else patch({ dismissed: { [id]: false } }); render(); });
        break;
      }
      case "go": {
        const target = el.dataset.step;
        if (!target) return;
        at = target === "__end" ? "__end" : target;
        if (at === "__end") { at = null; const firstOpen = plan.steps.find((s) => !complete(s)); if (firstOpen) { at = firstOpen.id; toast(`${SHORT[firstOpen.id] || firstOpen.title} still has things left`); } else at = "__done"; }
        saveLocal(); render(); window.scrollTo({ top: 0 });
        break;
      }
      case "tab": tab = el.dataset.tab; saveLocal(); render(); window.scrollTo({ top: 0 }); break;
      case "dump": openDump(); break;
      case "reset": confirming = true; render(); break;
      case "reset-no": confirming = false; render(); break;
      case "reset-yes": {
        confirming = false;
        prog = normal({}); at = null; saveLocal();
        outbox = null; saveLocal();
        if (progRef) progRef.set(clone(prog)).catch(() => {});
        render(); window.scrollTo({ top: 0 }); toast("Cleared. Ready for the next trip.");
        break;
      }
    }
  });

  // Typed answers: save as you go, one write per pause.
  const answerTimers = {};
  view.addEventListener("input", (e) => {
    const ta = e.target.closest('[data-act="answer"]');
    if (ta) {
      autosize(ta);
      const id = ta.closest("[data-id]").dataset.id;
      const val = ta.value;
      const dec = ta.closest(".dec");
      dec.classList.toggle("on", !!val.trim());
      dec.querySelectorAll(".opts button").forEach((b) => b.setAttribute("aria-pressed", "false"));
      prog.answers[id] = val; saveLocal(); refreshCounts();
      clearTimeout(answerTimers[id]);
      answerTimers[id] = setTimeout(() => patch({ answers: { [id]: val } }), 600);
      return;
    }
    const add = e.target.closest(".add");
    if (add) add.querySelector(".go").hidden = !e.target.value.trim();
  });
  const autosize = (ta) => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; };

  view.addEventListener("submit", (e) => {
    const form = e.target.closest(".add");
    if (!form) return;
    e.preventDefault();
    const input = form.querySelector("input");
    const names = input.value.split(/\n|,(?![^(]*\))/).map((s) => s.trim()).filter(Boolean).map((s) => s[0].toUpperCase() + s.slice(1));
    if (!names.length) return;
    names.forEach((name, n) => patch({ added: { [newId()]: { name, step: form.dataset.step, at: Date.now() + n } } }));
    render();
    const again = view.querySelector(".add input"); if (again) again.focus();
  });
  const newId = () => "a" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

  $("#tab-pack").onclick = () => { tab = "pack"; saveLocal(); render(); };
  $("#tab-days").onclick = () => { tab = "days"; saveLocal(); render(); };

  /* ---------- Thought of something? (Claude sorts it into steps) ---------- */
  let sample = null, canSort = false, sorted = null;
  const dlg = $("#dump");
  function openDump() {
    sorted = null;
    $("#dump-text").value = ""; $("#dump-out").hidden = true; $("#dump-msg").hidden = true;
    $("#dump-text").hidden = false; $("#dump-go").textContent = "Sort it"; $("#dump-go").disabled = false;
    dlg.showModal(); $("#dump-text").focus();
  }
  $("#dump-go").onclick = async () => {
    if (sorted) {
      sorted.forEach((s, n) => patch({ added: { [newId()]: { name: s.name, step: s.step, note: s.note || "", at: Date.now() + n } } }));
      dlg.close(); render();
      toast(`Added ${sorted.length} ${sorted.length === 1 ? "thing" : "things"}`);
      return;
    }
    const text = $("#dump-text").value.trim();
    if (!text || !sample) return;
    const btn = $("#dump-go"); btn.disabled = true; btn.textContent = "Sorting…";
    const steps = plan.steps.map((s) => `- ${s.id}: ${s.title}. ${s.why || ""}`).join("\n");
    const have = allItems().filter((it) => it.kind !== "decide").map((it) => it.name).concat(Object.values(prog.added).filter((a) => isObj(a) && !a.gone).map((a) => a.name));
    const prompt = `You help someone pack for a trip (${plan.title}, ${plan.sub || ""}). They said the text below out loud, so it rambles. ` +
      `Pull out each separate thing to pack or do, give it a short name (2–5 words, sentence case), and put it in the best step. ` +
      `Skip anything already in their list. Skip chatter that isn't a thing to pack or do. Add a short note only if they said something specific about it (how many, which one).\n\n` +
      `Steps (use the id):\n${steps}\n\nAlready in their list: ${have.join(", ")}\n\n` +
      `Reply with only a JSON array like [{"name":"Phone tripod","step":"cabin","note":""}]. Reply [] if there's nothing new.\n\nWhat they said:\n${text}`;
    try {
      const out = await sample.json(prompt, { modelTier: "default" });
      const ids = new Set(plan.steps.map((s) => s.id));
      sorted = (Array.isArray(out) ? out : []).filter((s) => s && typeof s.name === "string" && s.name.trim())
        .map((s) => ({ name: s.name.trim().slice(0, 80), step: ids.has(s.step) ? s.step : plan.steps[stepIndex()]?.id || plan.steps[0].id, note: typeof s.note === "string" ? s.note.slice(0, 120) : "" }));
      if (!sorted.length) { sorted = null; btn.disabled = false; btn.textContent = "Sort it"; msg("Nothing new in that. It's all in your list already."); return; }
      $("#dump-text").hidden = true;
      const out2 = $("#dump-out");
      out2.innerHTML = sorted.map((s) => `<li><span>${esc(s.name)}${s.note ? ` <small>${esc(s.note)}</small>` : ""}</span><small>${esc(SHORT[s.step] || s.step)}</small></li>`).join("");
      out2.hidden = false;
      msg("Here's where each thing goes.");
      btn.disabled = false; btn.textContent = `Add ${sorted.length}`;
    } catch (e) {
      btn.disabled = false; btn.textContent = "Sort it";
      msg(e && e.code === "rate_limited" ? "Claude is busy. Try again in a minute." : e && e.code === "not_granted" ? "Claude needs your permission to sort this. You can still add things in each step." : "That didn't work. Try again, or add things in each step.");
    }
  };
  const msg = (t) => { const m = $("#dump-msg"); m.textContent = t; m.hidden = false; };

  /* ---------- Toast ---------- */
  let toastTimer, undo = null;
  function toast(text, action) {
    const el = $("#toast"), btn = $("#toast-btn");
    $("#toast-text").textContent = text;
    btn.hidden = !action; el.classList.toggle("has-action", !!action);
    undo = action || null;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.classList.remove("show"); undo = null; }, action ? 5000 : 2400);
  }
  $("#toast-btn").onclick = () => { if (undo) undo(); undo = null; $("#toast").classList.remove("show"); };

  /* ---------- Sync with the Claude account ----------
     The plan (written by Claude) and progress (ticks, answers, additions) are two docs in this
     artifact's private per-person store. The last copy is kept on the device, so it works offline. */
  let sync = outsideClaude ? "elsewhere" : "connecting"; // elsewhere | connecting | on | offline | signed-out
  function syncText() {
    switch (sync) {
      case "on": return "Saved to your Claude account, so it's the same on all your devices.";
      case "connecting": return "Connecting to your Claude account…";
      case "offline": return "Can't reach your Claude account. Ticks are kept on this device and sync when it's back.";
      case "signed-out": return "Sign in to Claude to see your trip.";
      default: return `<a href="${ARTIFACT_URL}" target="_blank" rel="noopener">Open Packed in Claude</a> to see your trip.`;
    }
  }
  function setSync(s) { if (sync === s) return; sync = s; document.querySelectorAll("#sync-note").forEach((el) => { el.innerHTML = syncText(); }); }
  const busy = () => { const a = document.activeElement; return !!(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && view.contains(a)); };
  let held = false;
  view.addEventListener("focusout", () => setTimeout(() => { if (held && !busy()) { held = false; rerender(); } }, 0));
  const rerender = () => { if (busy()) { held = true; return; } const y = window.scrollY; render(); window.scrollTo(0, y); };

  (async () => {
    if (sync === "elsewhere") { render(); return; }
    for (let i = 0; i < 30 && !(window.claude && window.claude.use); i++) await new Promise((r) => setTimeout(r, 100));
    if (!(window.claude && window.claude.use)) { sync = "elsewhere"; render(); return; }
    const [db, user, smp] = await Promise.all([window.claude.use("db"), window.claude.use("user"), window.claude.use("sample")]);
    sample = smp; canSort = !!smp;
    const id = user ? await user.id() : null;
    if (!db || !id) { sync = "signed-out"; render(); return; }
    const base = "data/users/" + id + "/";
    const planRef = db.doc(base + "plan");
    progRef = db.doc(base + "progress");
    const slow = setTimeout(() => { if (sync === "connecting") { sync = "offline"; render(); } }, 10000);
    planRef.onSnapshot((snap) => {
      if (snap.metadata.fromCache) return;
      clearTimeout(slow);
      const data = snap.exists ? snap.data() : null;
      const next = data && Array.isArray(data.steps) ? data : null;
      if (JSON.stringify(next) !== JSON.stringify(plan)) { sync = "on"; plan = next; saveLocal(); rerender(); }
      else setSync("on");
    }, () => { clearTimeout(slow); setSync("offline"); });
    let first = true;
    progRef.onSnapshot((snap) => {
      if (snap.metadata.hasPendingWrites || snap.metadata.fromCache) return;
      const data = snap.exists ? snap.data() : null;
      if (!data) { progRef.set(clone(prog)).then(() => { outbox = null; saveLocal(); }, () => {}); return; }
      // The account's copy wins, plus anything this device changed that hasn't reached it yet.
      if (writing && !first) return;
      first = false;
      const next = normal(data);
      if (outbox) { merge(next, outbox); flush(); }
      if (JSON.stringify(next) === JSON.stringify(prog)) return;
      prog = next; saveLocal(); rerender();
    }, () => setSync("offline"));
  })();

  render();
})();
</script>
</body>
</html>
